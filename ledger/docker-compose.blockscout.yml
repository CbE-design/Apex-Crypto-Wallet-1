# Apex Private Ledger — Blockscout explorer for a local Anvil node.
#
# Prerequisites:
#   1. Anvil must be running and reachable from Docker. Bind it to all
#      interfaces so the containers can reach it:
#        anvil --host 0.0.0.0 --chain-id 31337
#   2. On Linux, host.docker.internal is provided via extra_hosts below.
#
# Start:   docker compose -f ledger/docker-compose.blockscout.yml up -d
# Explorer: http://localhost:4000  (set NEXT_PUBLIC_BLOCKSCOUT_URL to this)
#
# This indexes ONLY your private Anvil chain. It is not connected to any
# public network.

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: blockscout
      POSTGRES_DB: blockscout
    volumes:
      - blockscout-db:/var/lib/postgresql/data
    ports:
      - "7432:5432"

  backend:
    image: blockscout/blockscout:latest
    restart: always
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ETHEREUM_JSONRPC_VARIANT: anvil
      ETHEREUM_JSONRPC_HTTP_URL: http://host.docker.internal:8545
      ETHEREUM_JSONRPC_TRACE_URL: http://host.docker.internal:8545
      DATABASE_URL: postgresql://blockscout:blockscout@db:5432/blockscout
      CHAIN_ID: "31337"
      COIN: "APX"
      NETWORK: "Apex Private Ledger"
      SUBNETWORK: "Private Permissioned Network"
      SECRET_KEY_BASE: "56NtB48ear7+wMSf0IQuWDAAazhpb31qyc7GiyspBP2vh7t5zlCsF5QDv76chXeN"
      PORT: "4000"
      DISABLE_EXCHANGE_RATES: "true"
      SHOW_PRICE_CHART: "false"
      SHOW_TESTNET_LABEL: "true"
      TESTNET_LABEL_TEXT: "Private Ledger"
    command: >
      sh -c "bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" &&
             bin/blockscout start"
    ports:
      - "4000:4000"

volumes:
  blockscout-db:
