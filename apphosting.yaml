# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  maxInstances: 10
  minInstances: 1
  cpu: 1

# Environment variables for the backend
# This links to the secret you created in Secret Manager
env:
  - variable: FIREBASE_ADMIN_SDK_CONFIG
    secret: FIREBASE_ADMIN_SDK_CONFIG
